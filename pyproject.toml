[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pt2mirandese"
dynamic = ["version"]
description = "Rule-based translator from European Portuguese to Mirandese"
readme = "README.md"
license = { text = "Apache-2.0 AND CC-BY-SA-4.0" }
authors = [{ name = "JarbasAi", email = "jarbasai@mailfence.com" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["mirandese", "mwl", "portuguese", "machine-translation", "rule-based", "minority-language"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
test = ["pytest"]
eval = ["sacrebleu"]

[project.scripts]
pt2mirandese = "pt2mirandese:main"

[project.urls]
Homepage = "https://github.com/TigreGotico/pt2mirandese"
Repository = "https://github.com/TigreGotico/pt2mirandese"

[tool.setuptools.packages.find]
where = ["."]
include = ["pt2mirandese*"]

[tool.setuptools.dynamic]
version = {attr = "pt2mirandese.version.VERSION_STR"}

[tool.setuptools.package-data]
pt2mirandese = ["data/*.tsv", "data/*.txt"]

[tool.ruff]
line-length = 120
